<style>
  .carousel {

  }
  .modal-content {

  }

    color: rgb(255, 228, 202);
  }

  .testrenders {
    display: flex;
    justify-content: center; /* Horizontally center the images */

  }

  .testrenders img {

  .image-container img {
    max-width: 100%; /* Ensure images don't overflow their container */

  }
</style>
