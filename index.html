<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.min.css" />
    <link rel="stylesheet" href="modal.min.css" />
    <link rel="stylesheet" href="carousel.min.css" />
    <title>willproc.github.io</title>
    <link rel="icon" href="images/favicon-a.png" />
    <meta name="work" content="work showcase" />
    <meta name="author" content="Will" />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <header class="banner-body">
        <div class="banner-headline">
          <h1>Will Proctor</h1>
          <h2 style="text-transform: lowercase">
            Showreel, Portfolio & other work
          </h2>
        </div>
      </header>

      <div class="contents">
        <div class="color-adjustments">
          <button id="theme-cycler">
            <img src="icon/color_adjust.svg" class="button-img" />
          </button>
        </div>
        <div class="tabs">
          <h3 class="tab" data-target="art">Project (2021-2023)</h3>
          <h3 class="tab" data-target="code">Tools/Code</h3>
          <h3 class="tab" data-target="showreel">Showreel</h3>
        </div>
      </div>
      <div class="content-container">
        <div id="art" class="content active">
          <!--         -->
          <!-- Project -->
          <!--         -->
          <div id="image-container" class="grid">
            <!-- Space Station Facility -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/ssfa.html"
            >
              <img
                src="media/ssfa/thumbnail.jpg"
                alt="Space Station Facility"
              />
            </div>
            <!-- Non-fiction -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/nofc.html"
            >
              <img src="media/nofc/thumbnail.gif" alt="Non fiction Project" />
            </div>
            <!-- Terrain Research and Development -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/trrn.html"
            >
              <img
                src="media/trrn/thumbnail.jpg"
                alt="Terrain Research and Development"
              />
            </div>
            <!-- Hightown -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/htwn.html"
            >
              <img src="media/htwn/thumbnail.jpg" alt="Hightown" />
            </div>
            <!-- Rwanda -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/gmba.html"
            >
              <img src="media/gmba/thumbnail.jpg" alt="Rwanda" />
            </div>
            <!-- Barbed -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/barb.html"
            >
              <img src="media/barb/content/wireframe-a.gif" alt="Barbed" />
            </div>
            <!-- Night Knight -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/nikn.html"
            >
              <img src="media/nikn/thumbnail.jpg" alt="Night Knight" />
            </div>
            <!-- The Grove -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/grve.html"
            >
              <img src="media/grve/thumbnail.jpg" alt="The Grove" />
            </div>
            <!-- Viking Short Story -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/vkng.html"
            >
              <img src="media/vkng/thumbnail.jpg" alt="Viking Short Story" />
            </div>
            <!-- DNEG -->
            <div
              class="project thumbnail"
              data-type="html"
              data-src="content/dneg.html"
            >
              <img src="media/extra/thumbnail-dneg.jpg" alt="DNEG" />
            </div>
          </div>

          <!--          -->
          <!-- Gallery  -->
          <!--          -->
          <div id="image-container" class="grid">
            <!-- knight_garden -->
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/knight_garden.png"
            >
              <img
                src="media/gallery/knight_garden.png"
                alt="knight_garden.png"
              />
            </div>

            <!-- /dynamite -->
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/dynamite.jpg"
            >
              <img src="media/gallery/dynamite.jpg" alt="dynamite.jpg" />
            </div>

            <!-- destination -->
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/destination.jpg"
            >
              <img src="media/gallery/destination.jpg" alt="destination.jpg" />
            </div>

            <!-- cavern -->
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/cavern.png"
            >
              <img src="media/gallery/cavern.png" alt="cavern.png" />
            </div>

            <!-- enigma_01 -->
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/enigma_01.png"
            >
              <img src="media/gallery/enigma_01.png" alt="enigma_01.png" />
            </div>
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/enigma_02.jpg"
            >
              <img src="media/gallery/enigma_02.jpg" alt="enigma_02.jpg" />
            </div>
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/forzen_giant_01.png"
            >
              <img
                src="media/gallery/forzen_giant_01.png"
                alt="forzen_giant_01.png"
              />
            </div>
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/guest.png"
            >
              <img src="media/gallery/guest.png" alt="guest.png" />
            </div>
            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/heart_on_ice.png"
            >
              <img
                src="media/gallery/heart_on_ice.png"
                alt="heart_on_ice.png"
              />
            </div>

            <div
              class="project thumbnail"
              data-type="image"
              data-src="media/gallery/sculpt_01.jpg"
            >
              <img src="media/gallery/sculpt_01.jpg" alt="sculpt_01.jpg" />
            </div>


          </div>
        </div>

        <!--      -->
        <!-- Code -->
        <!--      -->
        <div id="code" class="content">
          <p>2024</p>
        </div>

        <!--          -->
        <!-- Showreel -->
        <!--          -->
        <div id="showreel" class="content">
          <div class="showreel-container">
            <div class="video-container">
              <iframe
                src="https://player.vimeo.com/video/741098651?h=63d008648f&title=0&byline=0&portrait=0"
                width="640"
                height="360"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Modal -->
      <div id="modal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
          <!-- Content will be loaded here -->
        </div>
      </div>

      <!-- Nested Modal (for images inside HTML content) -->
      <div id="nested-modal" class="modal">
        <span class="close">&times;</span>
        <div class="nested-modal-content">
          <!-- Nested image content will be loaded here -->
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="script.min.js"></script>
    <script src="modal.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <!-- <script src="carousel.js"></script> -->
  </body>
</html>
